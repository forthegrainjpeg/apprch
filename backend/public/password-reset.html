<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apprch password reset</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf7f2;
        color: #1c1b19;
      }
      main { text-align: center; padding: 32px; max-width: 22rem; width: 100%; box-sizing: border-box; }
      h1 { font-size: 2rem; margin-bottom: 8px; }
      p { color: #5c574f; }
      form { display: grid; gap: 12px; margin-top: 24px; text-align: left; }
      label { font-size: 0.85rem; font-weight: 600; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d8d2c8;
        border-radius: 12px;
        font-size: 1rem;
        background: #fff;
      }
      button, .button {
        display: inline-block;
        margin-top: 8px;
        padding: 14px 22px;
        border: 0;
        border-radius: 999px;
        background: #1c1b19;
        color: #faf7f2;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .error { color: #b42318; font-size: 0.9rem; }
      .ok { color: #2f6f3e; font-size: 0.95rem; }
      #form, #done, #invalid { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Apprch password reset</h1>
      <p id="lead">Choose a new password for your account.</p>

      <form id="form">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required />
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="6" required />
        <p id="error" class="error" hidden></p>
        <button id="submit" type="submit">Save new password</button>
      </form>

      <div id="done">
        <p class="ok">Your password is updated. Open Apprch and sign in with it.</p>
      </div>

      <div id="invalid">
        <p class="error">This reset link expired or was already used. Open Apprch and tap Forgot password? for a new one.</p>
      </div>
    </main>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
      import {
        getAuth,
        verifyPasswordResetCode,
        confirmPasswordReset,
      } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

      const params = new URLSearchParams(location.search);
      const mode = params.get("mode");
      const oobCode = params.get("oobCode");
      const form = document.getElementById("form");
      const done = document.getElementById("done");
      const invalid = document.getElementById("invalid");
      const error = document.getElementById("error");
      const submit = document.getElementById("submit");
      const lead = document.getElementById("lead");

      const auth = getAuth(initializeApp({
        apiKey: "AIzaSyBPSratTKbjajMLVZsQEeEJCDpmbhWSzXA",
        authDomain: "fresh-scoop.firebaseapp.com",
        projectId: "fresh-scoop",
      }));

      function show(el) {
        form.style.display = "none";
        done.style.display = "none";
        invalid.style.display = "none";
        el.style.display = el === form ? "grid" : "block";
      }

      if (mode !== "resetPassword" || !oobCode) {
        lead.textContent = "This isn’t a valid Apprch reset link.";
        show(invalid);
      } else {
        try {
          await verifyPasswordResetCode(auth, oobCode);
          show(form);
        } catch {
          show(invalid);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        error.hidden = true;
        if (password.length < 6) {
          error.textContent = "Use at least 6 characters.";
          error.hidden = false;
          return;
        }
        if (password !== confirm) {
          error.textContent = "Those passwords don’t match.";
          error.hidden = false;
          return;
        }
        submit.disabled = true;
        try {
          await confirmPasswordReset(auth, oobCode, password);
          lead.textContent = "You’re all set.";
          show(done);
        } catch (err) {
          submit.disabled = false;
          error.textContent = err?.code === "auth/expired-action-code"
            ? "This reset link expired. Request a new one from the app."
            : "Couldn’t save that password. Try again.";
          error.hidden = false;
        }
      });
    </script>
  </body>
</html>
