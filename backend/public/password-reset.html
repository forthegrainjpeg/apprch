<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apprch</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf7f2;
        color: #1c1b19;
      }
      main { text-align: center; padding: 32px; max-width: 22rem; width: 100%; box-sizing: border-box; }
      h1 { font-size: 2rem; margin-bottom: 8px; }
      p { color: #5c574f; }
      form { display: grid; gap: 12px; margin-top: 24px; text-align: left; }
      label { font-size: 0.85rem; font-weight: 600; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d8d2c8;
        border-radius: 12px;
        font-size: 1rem;
        background: #fff;
      }
      button, a.button {
        display: inline-block;
        margin-top: 8px;
        padding: 14px 22px;
        border: 0;
        border-radius: 999px;
        background: #1c1b19;
        color: #faf7f2;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .error { color: #b42318; font-size: 0.9rem; }
      .ok { color: #2f6f3e; font-size: 0.95rem; }
      .panel { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Apprch</h1>
      <p id="lead">Open this link from an Apprch email to continue.</p>

      <form id="reset-form" class="panel">
        <p id="reset-email"></p>
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required />
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="6" required />
        <p id="reset-error" class="error" hidden></p>
        <button id="reset-submit" type="submit">Save new password</button>
      </form>

      <div id="done" class="panel">
        <p id="done-copy" class="ok"></p>
        <a id="continue" class="button" hidden href="#">Continue</a>
      </div>

      <div id="recover" class="panel">
        <p class="ok" id="recover-copy"></p>
        <button id="recover-reset" type="button">Email a password reset</button>
        <p id="recover-followup" class="ok" hidden>Check that inbox for a reset link.</p>
      </div>

      <div id="invalid" class="panel">
        <p class="error" id="invalid-copy">This link expired or isn’t valid. Open Apprch and try again.</p>
      </div>
    </main>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
      import {
        getAuth,
        verifyPasswordResetCode,
        confirmPasswordReset,
        checkActionCode,
        applyActionCode,
        sendPasswordResetEmail,
      } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

      const params = new URLSearchParams(location.search);
      const mode = params.get("mode");
      const oobCode = params.get("oobCode");
      const apiKey = params.get("apiKey") || "AIzaSyBPSratTKbjajMLVZsQEeEJCDpmbhWSzXA";
      const continueUrl = safeContinue(params.get("continueUrl"));
      const lang = params.get("lang") || "en";

      document.documentElement.lang = lang;

      const title = document.getElementById("title");
      const lead = document.getElementById("lead");
      const resetForm = document.getElementById("reset-form");
      const done = document.getElementById("done");
      const recover = document.getElementById("recover");
      const invalid = document.getElementById("invalid");
      const continueButton = document.getElementById("continue");

      const auth = getAuth(initializeApp({
        apiKey,
        authDomain: "fresh-scoop.firebaseapp.com",
        projectId: "fresh-scoop",
      }));

      function show(el) {
        for (const panel of document.querySelectorAll(".panel")) {
          panel.style.display = "none";
        }
        el.style.display = el === resetForm ? "grid" : "block";
      }

      function safeContinue(value) {
        if (!value) return null;
        try {
          const url = new URL(value);
          const hosts = ["apprch.web.app", "apprch.app", "www.apprch.app"];
          if (url.protocol !== "https:" || !hosts.includes(url.hostname)) return null;
          return url.href;
        } catch {
          return null;
        }
      }

      function showContinue() {
        if (!continueUrl) return;
        continueButton.href = continueUrl;
        continueButton.hidden = false;
      }

      if (!oobCode || !mode) {
        title.textContent = "Apprch";
        lead.textContent = "This isn’t a complete Apprch account link.";
        show(invalid);
      } else if (mode === "resetPassword") {
        title.textContent = "Apprch password reset";
        lead.textContent = "Choose a new password for your account.";
        try {
          const email = await verifyPasswordResetCode(auth, oobCode);
          document.getElementById("reset-email").textContent = email
            ? "Resetting the password for " + email
            : "";
          show(resetForm);
        } catch {
          document.getElementById("invalid-copy").textContent =
            "This reset link expired or was already used. Open Apprch and tap Forgot Password for a new one.";
          show(invalid);
        }
      } else if (mode === "verifyEmail") {
        title.textContent = "Apprch email verification";
        try {
          await applyActionCode(auth, oobCode);
          lead.textContent = "You’re all set.";
          document.getElementById("done-copy").textContent =
            "Your email is verified. You can go back to Apprch.";
          showContinue();
          show(done);
        } catch {
          document.getElementById("invalid-copy").textContent =
            "This verification link expired. Open Apprch and request a new one.";
          show(invalid);
        }
      } else if (mode === "recoverEmail") {
        title.textContent = "Apprch email recovery";
        try {
          const info = await checkActionCode(auth, oobCode);
          const restoredEmail = info.data.email;
          await applyActionCode(auth, oobCode);
          lead.textContent = "Your email is restored.";
          document.getElementById("recover-copy").textContent = restoredEmail
            ? "This account is back to " + restoredEmail + "."
            : "The previous email is restored.";
          show(recover);
          document.getElementById("recover-reset").addEventListener("click", async () => {
            if (!restoredEmail) return;
            try {
              await sendPasswordResetEmail(auth, restoredEmail);
              document.getElementById("recover-followup").hidden = false;
            } catch {
              document.getElementById("recover-followup").hidden = false;
              document.getElementById("recover-followup").textContent =
                "Couldn’t send a reset. Open Apprch and tap Forgot Password.";
            }
          });
        } catch {
          document.getElementById("invalid-copy").textContent =
            "This recovery link expired or isn’t valid.";
          show(invalid);
        }
      } else {
        title.textContent = "Apprch";
        lead.textContent = "This account link isn’t recognized.";
        show(invalid);
      }

      resetForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        const error = document.getElementById("reset-error");
        const submit = document.getElementById("reset-submit");
        error.hidden = true;
        if (password.length < 6) {
          error.textContent = "Use at least 6 characters.";
          error.hidden = false;
          return;
        }
        if (password !== confirm) {
          error.textContent = "Those passwords don’t match.";
          error.hidden = false;
          return;
        }
        submit.disabled = true;
        try {
          await confirmPasswordReset(auth, oobCode, password);
          lead.textContent = "You’re all set.";
          document.getElementById("done-copy").textContent =
            "Your password is updated. Open Apprch and sign in with it.";
          showContinue();
          show(done);
        } catch (err) {
          submit.disabled = false;
          error.textContent = err?.code === "auth/expired-action-code"
            ? "This reset link expired. Request a new one from the app."
            : "Couldn’t save that password. Try again.";
          error.hidden = false;
        }
      });
    </script>
  </body>
</html>
